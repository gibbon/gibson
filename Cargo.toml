[package]
name = "gibson"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "A 3D file browser: fly through your folders as a city of glass towers"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
env_logger = "0.11.11"
fontdue = "0.9.5"
glam = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
log = "0.4.35"
pollster = "1.0.2"
rayon = "1.12.0"
wgpu = "30.0.2"
winit = "0.30.13"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57.3", default-features = false }
