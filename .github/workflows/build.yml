# Builds Gibson for Windows (.exe), macOS (universal .app) and Linux (x86_64
# tarball) on every push, each
# twice: a small download that uses an installed FFmpeg, and a "full" one carrying
# its own slim FFmpeg (built here from source, cached between runs).
# Pushing a tag like v0.2.0 also publishes them all as a GitHub Release, with the
# FFmpeg source tarball alongside (as its LGPL licence asks).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ffmpeg-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-windows-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 nasm
          bash packaging/ffmpeg/build.sh windows-x86_64 ffmpeg-out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-out

  ffmpeg-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-macos-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm
          bash packaging/ffmpeg/build.sh macos-arm64 ff-arm64
          bash packaging/ffmpeg/build.sh macos-x86_64 ff-x86_64
          mkdir -p ffmpeg-out
          lipo -create ff-arm64/ffmpeg ff-x86_64/ffmpeg -output ffmpeg-out/ffmpeg
          cp ff-arm64/COPYING.LGPLv2.1 ffmpeg-out/
          lipo -info ffmpeg-out/ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: ffmpeg-out

  ffmpeg-linux:
    # 22.04: an older glibc, so the binaries run on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-linux-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q nasm
          bash packaging/ffmpeg/build.sh linux-x86_64 ffmpeg-out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: ffmpeg-out

  windows:
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-out
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/gibson.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Gibson-windows.zip
          # Full: the same, plus ffmpeg.exe next to gibson.exe.
          ./ffmpeg-out/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          Copy-Item ffmpeg-out/ffmpeg.exe dist/
          Copy-Item packaging/ffmpeg/NOTICE.txt dist/FFMPEG-NOTICE.txt
          Copy-Item ffmpeg-out/COPYING.LGPLv2.1 dist/FFMPEG-COPYING.LGPLv2.1.txt
          Compress-Archive -Path dist/* -DestinationPath Gibson-windows-full.zip
          Copy-Item ffmpeg-out/ffmpeg-*.tar.xz .
          Get-ChildItem *.zip, *.tar.xz | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Gibson-windows
          path: |
            Gibson-windows.zip
            Gibson-windows-full.zip
            ffmpeg-*.tar.xz

  macos:
    needs: ffmpeg-macos
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos
          path: ffmpeg-out
      - run: |
          chmod +x ffmpeg-out/ffmpeg
          ffmpeg-out/ffmpeg -hide_banner -version | head -1
          bash packaging/macos/make_app.sh
          FFMPEG=ffmpeg-out bash packaging/macos/make_app.sh
          ls -la dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gibson-macos
          path: dist/*.zip

  linux:
    needs: ffmpeg-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux
          path: ffmpeg-out
      - shell: bash
        run: |
          set -euo pipefail
          chmod +x ffmpeg-out/ffmpeg
          ffmpeg-out/ffmpeg -hide_banner -version | head -1
          bash packaging/linux/make_tarball.sh
          FFMPEG=ffmpeg-out bash packaging/linux/make_tarball.sh
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Gibson-linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Gibson-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.tar.gz
            out/*.tar.xz
          generate_release_notes: true
